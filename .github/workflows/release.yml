# Builds release bundles for Windows, Linux, macOS, Android and iOS and publishes them as the
# latest GitHub release. Runs when:
#   - a commit pushed to main has [release] in its message: the release is named after the build
#     time in Vietnam time, as day.month.year_hour.minute.second (02.11.2026_14.30.05);
#   - a tag (v0.1.0, ...) is pushed: the release is named after the tag;
#   - by hand from the Actions tab (build only, no release).
#
# Secrets needed for the Android job (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of tauri-max-security.p12   (base64 -w0 tauri-max-security.p12)
#   ANDROID_KEYSTORE_PASSWORD  the keystore password (also used as the key password)
# The keystore must hold both identities, ec-384-identity and rsa-4096-identity: one APK is built
# and signed with each, so users can pick either.
#
# macOS and iOS are built without an Apple Developer account: the macOS app is only ad-hoc signed
# (not notarized), and the iOS .ipa is unsigned, for users who sign or sideload it themselves.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run builds at all, and the tag the release gets
  prepare:
    name: Prepare
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          else
            TAG=$(TZ=Asia/Ho_Chi_Minh date +%d.%m.%Y_%H.%M.%S)
            PUBLISH=$([ "$GITHUB_EVENT_NAME" = "push" ] && echo true || echo false)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (publish: $PUBLISH)"

  desktop:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            out: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the AppImage/.deb run on older glibc as well
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            out: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          # One universal app for Intel and Apple Silicon
          - name: macOS
            os: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf pkg-config rpm

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun test spec
      # "-" is ad-hoc signing: no Apple account needed, but Apple Silicon refuses to run
      # completely unsigned code. Ignored on other platforms.
      - run: bun tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args || '' }}
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  android:
    name: Android (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ECC P-384
            alias: ec-384-identity
            suffix: ecc-p384
          - label: RSA 4096
            alias: rsa-4096-identity
            suffix: rsa-4096
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The action's default package list still includes "tools", which is no longer in the SDK
      # repository and makes sdkmanager fail, so name the packages explicitly
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Newest stable NDK: pre-releases carry a suffix such as "-rc1" or "-beta1", so skip those
      - name: Install the latest stable NDK
        run: |
          NDK=$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+(\S*)' \
            | grep -vE -- '-|rc|beta' | sed 's/^ndk;//' | sort -uV | tail -n 1)
          if [ -z "$NDK" ]; then
            echo "::error::Could not find a stable NDK in the SDK repository"
            exit 1
          fi
          echo "Installing NDK $NDK"
          sdkmanager --install "ndk;$NDK" >/dev/null
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # The keystore only ever exists in the runner's temp directory, and is deleted afterwards
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so the APK cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the signed APK
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ matrix.alias }}
        run: bun tauri android build --apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # A build that was not signed is named "-unsigned"; refuse to publish it
      - name: Verify the signature
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was produced (check the signingConfigs block in build.gradle.kts)"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist-android
          mv "$APK" "dist-android/NekkoChat_${{ needs.prepare.outputs.tag }}_android-universal_${{ matrix.suffix }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.suffix }}
          path: dist-android/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # The Xcode project is not in the repository (it can only be generated on macOS)
      - name: Generate the Xcode project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            bun tauri ios init --ci
          fi

      # Built for devices with code signing switched off; the Xcode project's build phase
      # compiles the Rust library through `tauri ios xcode-script`
      - name: Build the app
        run: |
          PROJECT=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | sed -n '/Schemes:/,$p' | grep -E '_iOS$' | head -n 1 | xargs)
          echo "Building scheme $SCHEME of $PROJECT"
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -destination generic/platform=iOS -archs arm64 \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

      # An .ipa is just the .app inside a Payload folder, zipped
      - name: Package the .ipa
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 2 -name '*.app' -path '*iphoneos*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::The build produced no .app"
            exit 1
          fi
          mkdir -p ipa/Payload dist-ios
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../dist-ios/NekkoChat_${{ needs.prepare.outputs.tag }}_ios-unsigned.ipa" Payload)
          ls -l dist-ios

      - uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: dist-ios/*.ipa
          if-no-files-found: error

  release:
    name: Release
    needs: [prepare, desktop, android, ios]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      # Artifacts with several paths keep their bundle subfolders (nsis/, msi/, deb/, ...),
      # so collect every file into one flat folder
      - name: Collect files
        run: |
          mkdir artifacts
          find downloaded -type f -exec mv -n -t artifacts {} +
          if [ -n "$(find downloaded -type f)" ]; then
            echo "::error::Two artifacts have the same file name:"
            find downloaded -type f
            exit 1
          fi
          ls -l artifacts

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.tag }}
          make_latest: true
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
