# Builds release bundles for Windows, Linux and Android and attaches them to a draft GitHub
# release. Runs when:
#   - a commit pushed to main has [release] in its message: the release is tagged v<version>,
#     with the version taken from src-tauri/tauri.conf.json (bump it first);
#   - a version tag (v0.1.0, ...) is pushed;
#   - by hand from the Actions tab (build only, no release).
#
# Secrets needed for the Android job (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of tauri-max-security.p12   (base64 -w0 tauri-max-security.p12)
#   ANDROID_KEYSTORE_PASSWORD  the keystore password (also used as the key password)
# The keystore must hold both identities, ec-384-identity and rsa-4096-identity: one APK is built
# and signed with each, so users can pick either.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run builds at all, and the tag the release gets
  prepare:
    name: Prepare
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          else
            TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
            PUBLISH=$([ "$GITHUB_EVENT_NAME" = "push" ] && echo true || echo false)
            # A [release] commit must not reuse the tag of an earlier release
            if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Bump the version in src-tauri/tauri.conf.json before a [release] commit."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (publish: $PUBLISH)"

  desktop:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            out: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the AppImage/.deb run on older glibc as well
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            out: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf pkg-config rpm

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun test spec
      - run: bun tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  android:
    name: Android (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ECC P-384
            alias: ec-384-identity
            suffix: ecc-p384
          - label: RSA 4096
            alias: rsa-4096-identity
            suffix: rsa-4096
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # The keystore only ever exists in the runner's temp directory, and is deleted afterwards
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so the APK cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the signed APK
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ matrix.alias }}
        run: bun tauri android build --apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # A build that was not signed is named "-unsigned"; refuse to publish it
      - name: Verify the signature
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was produced (check the signingConfigs block in build.gradle.kts)"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist-android
          mv "$APK" "dist-android/NekkoChat_${{ needs.prepare.outputs.tag }}_android-universal_${{ matrix.suffix }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.suffix }}
          path: dist-android/*.apk
          if-no-files-found: error

  release:
    name: Draft release
    needs: [prepare, desktop, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A draft, so the release can be checked before it is published
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
