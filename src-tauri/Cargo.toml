[package]
name = "nekkochat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nekkochat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures = "0.3.34"
eventsource-stream = "0.2.3"
async-trait = "0.1.92"
tauri-plugin-dialog = "2"
keyring = "4"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
zeroize = "1.9.1"
getrandom = "0.4.3"
url = "2.5.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Speed over size: the release build is optimised for run time, not for binary size.
[profile.release]
opt-level = 3
lto = "fat"          # whole-program optimisation across all crates
codegen-units = 1    # one unit lets LLVM inline and optimise across the whole crate
panic = "abort"      # no unwinding tables, and no unwinding cost on the hot paths
strip = true         # symbols only add size and have no effect on speed

# `tauri dev` and `cargo test` build with the dev profile, where dependencies are normally not
# optimised at all. Argon2 (the vault) and the cryptography crates are then roughly 10x slower
# than in a release build. Optimise every dependency, but keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 3

# Our own code in `tauri dev`: level 1 is still easy to debug but about 10x faster than level 0
# on loops such as the RAG similarity search.
[profile.dev]
opt-level = 1
